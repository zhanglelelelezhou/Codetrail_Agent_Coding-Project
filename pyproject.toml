[project]
name = "codetrail-agent"
dynamic = ["version"]
description = "A terminal AI coding assistant with offline configuration diagnostics"
readme = "README.md"
keywords = ["ai-agent", "llm", "textual", "mcp", "developer-tools"]
requires-python = ">=3.11"
dependencies = [
    "textual>=2.1.0",
    "anthropic>=0.47.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=1.12.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
]

[project.urls]
Repository = "https://github.com/zhanglelelelezhou/Codetrail_Agent_Coding-Project"
Issues = "https://github.com/zhanglelelelezhou/Codetrail_Agent_Coding-Project/issues"

[project.scripts]
codetrail = "codetrail.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["codetrail"]

[tool.hatch.build.targets.wheel.force-include]
"NOTICE.md" = "codetrail/NOTICE.md"

[tool.hatch.version]
path = "codetrail/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["timeout(seconds): timeout hint for optional live integration tests"]
